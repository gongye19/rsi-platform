# Draft only. Replace URLs and map fields to the EXISTING business API.
# This file never modifies business code, global OpenCode config or deployment.
# Remote CRM tools/data still need a reachable isolated test environment;
# the current platform-local SQL CLI and localhost proxy are not remotely usable.
[agent]
type = "http"
name = "company-opencode-qa"
revision = "fill-in-business-deployment-revision"
url = "https://business-service.example/solve"
token_env = "BUSINESS_AGENT_TOKEN"
timeout = 600
answer_path = "data.answer"
require_harness_receipt = true

[agent.body]
question = "{prompt}"
request_id = "{request_id}"
task_id = "{task_id}"
harness_files = "{harness_files}"
harness_version = "{harness_version}"
harness_digest = "{harness_digest}"
component_protocol = "{component_protocol}"
seed = "{seed}"
# Add the service's EXISTING isolated-session/test-environment options here.
# Do not send platform-local harness_dir, workspace, paths or localhost DSNs.

[capabilities]
channels = ["instructions_rules"]
# Declare additional native channels only if this service can load them.

[trace]
url = "https://business-trace.example/requests/{request_id}"
token_env = "BUSINESS_TRACE_TOKEN"
trace_format = "opencode"
messages_path = "messages"
api_calls_path = "api_calls"
usage_path = "usage.total_tokens"
runtime_report_path = "runtime_report"
