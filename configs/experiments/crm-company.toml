schema = "harnesslens.experiment.v1"
benchmark = "crm"
# Optional, relative to this profile. Omit or leave empty for empty v0.
# initial_harness = "../../harnesses/business-agent"
mode = "train"
agent_config = "../../examples/agents/company-http.toml"
env_file = "../../.env"
# Change to ready in YOUR private profile only after data/tools/trace smoke passes.
readiness = "draft"

[models.execution]
managed_by = "business_agent"

[models.analysis]
model = "david/gpt-6.2-sol"
api = "responses"
base_url = "https://api.david-ai.net/v1"
api_key_env = "HAI_ANALYSIS_API_KEY"

[components]
allowed = ["*"]
denied = []

[environment]
HAI_MAX_ROLLOUT_CONCURRENCY = 1
HAI_MAX_ANALYSIS_CONCURRENCY = 1
HAI_PROVIDER_MAX_CONCURRENCY = 1
HAI_TOTAL_CREATION_BUDGET = 200
